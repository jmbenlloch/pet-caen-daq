services:
  docs:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    environment:
      DOCS_DOMAIN: ${DOCS_DOMAIN:?Set the documentation hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./users.caddy:/etc/caddy/users.caddy:ro
      - ./content:/srv/docs:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
