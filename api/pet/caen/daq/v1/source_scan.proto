syntax = "proto3";

package pet.caen.daq.v1;

import "pet/caen/daq/v1/system.proto";

option go_package = "github.com/jmbenlloch/pet-caen-daq/backend/gen/pet/caen/daq/v1;daqv1";

// Source scans acquire an ordinary PET run at every stationary grid point.
service SourceScanService {
  rpc StartSourceScan(StartSourceScanRequest) returns (StartSourceScanResponse) {}
  rpc GetSourceScan(GetSourceScanRequest) returns (GetSourceScanResponse) {}
  rpc ListSourceScans(ListSourceScansRequest) returns (ListSourceScansResponse) {}
  rpc CancelSourceScan(CancelSourceScanRequest) returns (CancelSourceScanResponse) {}
}

message SourceScanConfiguration {
  double x_min_mm = 1;
  double x_max_mm = 2;
  double y_min_mm = 3;
  double y_max_mm = 4;
  double pitch_mm = 5;
  double mm_per_turn = 6;
  uint32 full_steps_per_turn = 7;
  uint32 microsteps = 8;
  bool x_positive_direction_high = 9;
  bool y_positive_direction_high = 10;
  uint32 pulse_high_us = 11;
  uint32 pulse_low_us = 12;
  uint32 settle_milliseconds = 13;
  // Exactly one stopping criterion is required. Counts include drain overshoot.
  uint64 dwell_milliseconds = 14;
  uint64 event_count = 15;
  // Includes travel, settle and acquisition; also bounds a zero-event run.
  uint32 point_timeout_seconds = 16;
}

message StartSourceScanRequest {
  SourceScanConfiguration configuration = 1;
  StartRunRequest run = 2;
  // Operator has physically placed the source at the chosen logical (0,0).
  bool origin_confirmed = 3;
}
message StartSourceScanResponse {
  SourceScan scan = 1;
}
message GetSourceScanRequest {
  // Empty returns the current/latest scan for this server session.
  string scan_id = 1;
}
message GetSourceScanResponse {
  SourceScan scan = 1;
  bool device_configured = 2;
}
message ListSourceScansRequest {
  // Defaults to 20; maximum 100. Newest scans first.
  uint32 limit = 1;
  uint32 offset = 2;
}
message ListSourceScansResponse {
  repeated SourceScanHistoryEntry scans = 1;
  uint32 total_count = 2;
}
message SourceScanHistoryEntry {
  // New scans use xy-1, xy-2, ... independently of per-position run numbers.
  // Historical UUID-based identifiers remain valid.
  string scan_id = 1;
  string started_at = 2;
  string completed_at = 3;
  string state = 4;
  uint32 completed_points = 5;
  uint32 total_points = 6;
  string requested_by = 7;
}
message CancelSourceScanRequest {
  string scan_id = 1;
  string requested_by = 2;
}
message CancelSourceScanResponse {
  SourceScan scan = 1;
}
message SourceScanPoint {
  uint32 index = 1;
  uint32 row = 2;
  uint32 column = 3;
  double requested_x_mm = 4;
  double requested_y_mm = 5;
  sint32 x_steps = 6;
  sint32 y_steps = 7;
  double calculated_x_mm = 8;
  double calculated_y_mm = 9;
  string run_id = 10;
  bool completed = 11;
}
message SourceScan {
  string scan_id = 1;
  // preparing, moving, settling, acquiring, stopping, completed, cancelled, failed.
  string state = 2;
  string error = 3;
  SourceScanConfiguration configuration = 4;
  repeated SourceScanPoint points = 5;
  uint32 completed_points = 6;
  uint32 current_point = 7;
  string started_at = 8;
  string completed_at = 9;
  string requested_by = 10;
  string janus_configuration = 11;
  // Calculated open-loop positions, never measured positions.
  string position_basis = 12;
}
